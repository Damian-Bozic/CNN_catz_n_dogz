[project]
name = "rush-nn"
version = "0.1.0"
description = "Cat and dog classifier using a PyTorch CNN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.0.0",
    "datasets>=5.1.0",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]

[tool.uv]
managed = true
package = false

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
